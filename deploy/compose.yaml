name: acceptances
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      ACCEPTANCES_DATA_DIR: /var/lib/acceptances
      ACCEPTANCES_PUBLIC_ORIGIN: http://127.0.0.1:8765
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - app-data:/var/lib/acceptances
volumes:
  app-data:
