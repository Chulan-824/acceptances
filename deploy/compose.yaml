name: acceptances
include:
  - compose.mysql.yaml
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      ACCEPTANCES_DATA_DIR: /var/lib/acceptances
      ACCEPTANCES_PUBLIC_ORIGIN: ${ACCEPTANCES_PUBLIC_ORIGIN:-http://127.0.0.1:8765}
      ACCEPTANCES_DB_DRIVER: mysql
      ACCEPTANCES_MYSQL_DSN_FILE: /run/secrets/mysql_dsn
    secrets:
      - mysql_dsn
    depends_on:
      mysql:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - app-data:/var/lib/acceptances
volumes:
  app-data:
secrets:
  mysql_dsn:
    file: ../.cache/mysql/docker.dsn
