name: acceptances
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      ACCEPTANCES_DATABASE_URL: postgres://acceptances@postgres:5432/acceptances?sslmode=disable
      ACCEPTANCES_DATABASE_PASSWORD_FILE: /var/lib/acceptances/postgres-password
      ACCEPTANCES_DATA_DIR: /var/lib/acceptances
      ACCEPTANCES_PUBLIC_ORIGIN: http://127.0.0.1:8765
    secrets: [postgres_password]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - app-data:/var/lib/acceptances
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_USER: acceptances
      POSTGRES_DB: acceptances
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U acceptances -d acceptances"]
      interval: 5s
      timeout: 3s
      retries: 10
secrets:
  postgres_password:
    file: ${ACCEPTANCES_POSTGRES_PASSWORD_FILE:?set an absolute secret file path}
volumes:
  app-data:
  postgres-data:
