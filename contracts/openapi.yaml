openapi: 3.1.0
info:
  title: Acceptances V1 API
  version: 0.1.0-dev.1
  description: local V1 机器契约。工单 12–18 实现候选，x-implementation-status 标记已实现但尚待运行验收。
paths:
  /api/v1/capabilities:
    get:
      operationId: capabilities
      responses:
        "200":
          description: 基础构建信息
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - version
                  - commit
                  - phase
                properties:
                  version:
                    type: string
                  commit:
                    type: string
                  phase:
                    type: string
                    enum:
                      - foundation
                      - local-v1
                  schemaVersions:
                    type: array
                    items:
                      type: string
                  rulesetVersions:
                    type: array
                    items:
                      type: string
                  apiVersions:
                    type: array
                    items:
                      type: string
                  encodingVersions:
                    type: array
                    items:
                      type: string
  /health/live:
    get:
      operationId: liveness
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    const: alive
  /health/ready:
    get:
      operationId: readiness
      responses:
        "503":
          description: 业务尚未实现，不能用于验收
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - code
                properties:
                  status:
                    type: string
                    const: not_ready
                  code:
                    type: string
                    const: FOUNDATION_ONLY
