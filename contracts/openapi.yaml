components:
  schemas:
    ID:
      $ref: ./schemas/common.json#/$defs/id
    Version:
      type: string
      pattern: ^[0-9]+$
    Error:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - phase
            - message
            - retryable
            - details
            - requestId
          properties:
            code:
              type: string
            phase:
              type: string
            message:
              type: string
            retryable:
              type: boolean
            requestId:
              type: string
            details:
              type: array
              items:
                $ref: ./schemas/common.json#/$defs/diagnostic
    Definitions:
      $ref: ./schemas/definitions.json
    Target:
      $ref: ./schemas/target.json
    Plan:
      $ref: ./schemas/plan.json
    Report:
      $ref: ./schemas/report.json
    Manifest:
      $ref: ./schemas/manifest.json
    Evaluation:
      $ref: ./schemas/evaluation.json
    Snapshot:
      $ref: ./schemas/snapshot.json
    RevisionInput:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        reportBase64:
          type: string
          contentEncoding: base64
        manifestBase64:
          type: string
          contentEncoding: base64
      required:
        - id
        - reportBase64
        - manifestBase64
    ResultRef:
      $ref: ./schemas/common.json#/$defs/resultRef
    ReviewInput:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        snapshotId: *id002
        action:
          enum:
            - comment
            - reject_item
            - resolve_rejection
            - accept
            - reject
            - accept_risk
            - withdraw
        itemId: *id002
        reason: *id001
        riskItems:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              itemId: *id002
              reason: *id001
            required:
              - itemId
              - reason
        resolvesEventIds:
          type: array
          items: *id002
      required:
        - id
        - snapshotId
        - action
    Gate:
      type: object
      additionalProperties: false
      properties:
        satisfied:
          type: boolean
        snapshotId:
          type:
            - string
            - "null"
        basisVersion:
          $ref: "#/components/schemas/Version"
        reviewVersion:
          $ref: "#/components/schemas/Version"
        reasons:
          type: array
          items:
            $ref: ./schemas/common.json#/$defs/diagnostic
      required:
        - satisfied
        - snapshotId
        - basisVersion
        - reviewVersion
        - reasons
    SessionLogin:
      type: object
      additionalProperties: false
      properties:
        csrfToken: &id003
          type: string
      required:
        - csrfToken
    Session:
      type: object
      additionalProperties: false
      properties:
        username: *id003
        csrfToken: *id003
        expiresAt: &id004
          type: string
          format: date-time
      required:
        - username
        - csrfToken
        - expiresAt
    Activity:
      type: object
      additionalProperties: false
      properties:
        active: &id010
          type: boolean
      required:
        - active
    Project:
      type: object
      additionalProperties: false
      properties:
        id: &id005
          $ref: "#/components/schemas/UUID"
        name: *id003
        createdAt: *id004
      required:
        - id
        - name
    Repository:
      type: object
      additionalProperties: false
      properties:
        id: *id005
        displayName: *id003
        locator: *id003
        createdAt: *id004
      required:
        - id
        - displayName
        - locator
    Token:
      type: object
      additionalProperties: false
      properties:
        id: *id005
        name: *id003
        scopes:
          type: array
          items: *id003
        expiresAt: &id006
          type:
            - string
            - "null"
        revokedAt: *id006
        createdAt: *id004
      required:
        - id
        - name
        - scopes
        - expiresAt
    TokenCreated:
      type: object
      additionalProperties: false
      properties:
        id: *id005
        name: *id003
        scopes:
          type: array
          items: *id003
        expiresAt: *id006
        secret: *id003
      required:
        - id
        - name
        - scopes
        - expiresAt
        - secret
    DocumentImported:
      type: object
      additionalProperties: false
